services:
  - type: web
    name: smart-itinerary-planning
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: srv-db4k6inf3r2c739qvp1g
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: travel_db
      - key: JWT_SECRET
        generateValue: true
